<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>CV</title>

    <style>
        @page {
            size: A4;
            margin: 0;
        }

        * {
            box-sizing: border-box;
            -webkit-box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 11pt;
            line-height: 1.55;
            color: #1f2937;
            margin: 0;
            padding: 0;
            background: #f8fafc;
            -fs-pdf-font-embed: embed;
            -fs-pdf-font-encoding: Identity-H;
        }

        .page {
            width: 100%;
            max-width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            display: table;
            table-layout: fixed;
            background: white;
            overflow: hidden;
            box-shadow: 0 10mm 25mm rgba(15, 23, 42, 0.08);
        }

        .sidebar {
            display: table-cell;
            vertical-align: top;
            width: 28%;
            background-color: #0b1424;
            color: #e2e8f0;
            padding: 14mm 7mm 12mm 7mm;
            font-size: 9pt;
        }

        .sidebar-content {
            width: 100%;
            text-align: center;
        }

        .main-content {
            display: table-cell;
            vertical-align: top;
            width: 72%;
            padding: 16mm 12mm 12mm 12mm;
            background-color: #ffffff;
            page-break-inside: auto;
        }

        h1,
        h2,
        h3 {
            margin: 0;
            padding: 0;
        }

        .name-title {
            font-size: 26pt;
            font-weight: 800;
            letter-spacing: 0.4mm;
            color: #0f172a;
            line-height: 1.08;
            margin-bottom: 4mm;
        }

        .name-highlight {
            color: #0ea5e9;
        }

        .job-title {
            font-size: 12.5pt;
            font-weight: 600;
            color: #475569;
            text-transform: none;
            letter-spacing: 0.4px;
            margin-bottom: 7mm;
        }

        .section-title {
            font-size: 12pt;
            font-weight: 750;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 2mm;
            margin-bottom: 7mm;
            margin-top: 2mm;
        }

        .profile-pic-container {
            text-align: center;
            margin-bottom: 10mm;
        }

        .profile-pic-outer {
            display: inline-block;
            width: 52mm;
            height: 52mm;
            border-radius: 50%;
            border: 3px solid #0891b2;
            box-sizing: border-box;
            background: #0b1424;
            text-align: center;
            line-height: 0;
            padding: 3mm;
        }

        .profile-pic-wrapper {
            display: inline-block;
            width: 44mm;
            height: 44mm;
            border-radius: 50%;
            overflow: hidden;
            background: #0b1424;
        }

        .profile-pic-fill {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .initials-pic-wrapper {
            text-align: center;
            margin-bottom: 10mm;
        }

        .initials-pic {
            display: inline-block;
            width: 44mm;
            height: 44mm;
            line-height: 44mm;
            border-radius: 50%;
            background: linear-gradient(135deg, #0ea5e9, #22c55e);
            color: white;
            font-size: 22pt;
            font-weight: 800;
            text-align: center;
            border: 3.5px solid rgba(255, 255, 255, 0.35);
        }

        .sb-section {
            margin-bottom: 11mm;
            page-break-inside: avoid;
            text-align: center;
        }

        .sb-title {
            font-size: 11pt;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.9px;
            color: #a5b4fc;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 2mm;
            margin-bottom: 5mm;
        }

        .contact-list {
            display: block;
            width: 100%;
        }

        .contact-row {
            color: #e2e8f0;
            display: table;
            text-align: left;
            width: 100%;
            line-height: 1.35;
        }

        .contact-row + .contact-row {
            margin-top: 2.5mm;
        }

        .contact-icon {
            width: 5mm;
            height: 5mm;
            display: table-cell;
            vertical-align: top;
            text-align: center;
            color: #a5b4fc;
            background: rgba(14, 165, 233, 0.08);
            border: 1px solid rgba(14, 165, 233, 0.3);
            border-radius: 50%;
            padding: 0.5mm;
            font-size: 8pt;
            line-height: 1;
        }

        .contact-text {
            display: table-cell;
            vertical-align: top;
            padding-left: 2.5mm;
            font-size: 9pt;
            line-height: 1.35;
            letter-spacing: 0.2px;
            white-space: normal;
        }

        .skill-tag {
            display: inline-block;
            vertical-align: middle;
            background: rgba(34, 211, 238, 0.1);
            color: #cbd5e1;
            padding: 1.6mm 3.2mm;
            border-radius: 4px;
            margin-right: 1.5mm;
            margin-bottom: 2.2mm;
            font-size: 8.7pt;
            border: 1px solid rgba(148, 163, 184, 0.35);
        }

        .summary-box {
            background: linear-gradient(120deg, rgba(14, 165, 233, 0.08), rgba(34, 197, 94, 0.06));
            border-left: 4px solid #0ea5e9;
            padding: 5.5mm;
            margin-bottom: 12mm;
            font-style: normal;
            color: #1f2937;
            border-radius: 8px;
            page-break-inside: avoid;
            box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.22);
        }

        .exp-item {
            margin-bottom: 10mm;
            position: relative;
            page-break-inside: avoid;
            padding-left: 1mm;
        }

        .exp-header {
            margin-bottom: 1.8mm;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 2mm;
            align-items: baseline;
        }

        .exp-role {
            font-size: 12.2pt;
            font-weight: 750;
            color: #0f172a;
        }

        .exp-company {
            font-size: 10pt;
            font-weight: 650;
            color: #0ea5e9;
            margin-bottom: 2mm;
        }

        .exp-date-badge {
            font-size: 8.5pt;
            font-weight: 700;
            background: #e0f2fe;
            color: #0369a1;
            padding: 1mm 3.6mm;
            border-radius: 10px;
            white-space: nowrap;
            border: 1px solid rgba(14, 165, 233, 0.35);
        }

        .exp-desc {
            color: #334155;
            margin-bottom: 3.5mm;
            text-align: justify;
        }

        .tech-stack-row {
            margin-top: 2.5mm;
        }

        .tech-pill {
            display: inline-block;
            font-size: 8pt;
            color: #0f172a;
            background: #ecfeff;
            padding: 0.8mm 2.5mm;
            border-radius: 4px;
            margin-right: 1.2mm;
            font-weight: 700;
            border: 1px solid rgba(14, 165, 233, 0.3);
        }

        .timeline-container {
            border-left: 2px solid #e2e8f0;
            padding-left: 6mm;
            margin-left: 0;
            display: grid;
            row-gap: 1mm;
            width: 100%;
            box-sizing: border-box;
        }

        .exp-item::before {
            content: '';
            position: absolute;
            left: -7.3mm;
            top: 1.6mm;
            width: 3mm;
            height: 3mm;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #0ea5e9;
            box-shadow: 0 0 0 2px #ffffff;
        }

        .footer {
            margin-top: 12mm;
            padding-top: 6mm;
            border-top: 1px dashed #cbd5e1;
            text-align: center;
            font-size: 8.2pt;
            color: #94a3b8;
        }
    </style>
</head>

<body>
<div class="page">

    <div class="sidebar">
        <div class="sidebar-content">

            <div th:if="${profile.photoUrl != null and !profile.photoUrl.isEmpty()}" class="profile-pic-container">
                <div class="profile-pic-outer">
                    <div class="profile-pic-wrapper">
                        <div class="profile-pic-fill" role="img" aria-label="Photo de profil"
                             th:style="|background-image: url('${profile.photoUrl}');|"></div>
                    </div>
                </div>
            </div>

            <div th:unless="${profile.photoUrl != null and !profile.photoUrl.isEmpty()}">
                <div class="initials-pic-wrapper">
                    <div class="initials-pic" th:text="${
                            (profile.firstName != null ? profile.firstName.substring(0,1) : '') +
                            (profile.lastName != null ? profile.lastName.substring(0,1) : '')
                         }">
                        ID
                    </div>
                </div>
            </div>

            <div class="sb-section">
                <div class="sb-title">Contact</div>

                <div class="contact-list">
                    <div class="contact-row" th:if="${profile.email}">
                        <span class="contact-icon" aria-hidden="true">@</span>
                        <span class="contact-text" th:text="${profile.email}">email</span>
                    </div>

                    <div class="contact-row" th:if="${profile.phone}">
                        <span class="contact-icon" aria-hidden="true">T</span>
                        <span class="contact-text" th:text="${profile.phone}">phone</span>
                    </div>

                    <div class="contact-row" th:if="${profile.city}">
                        <span class="contact-icon" aria-hidden="true">L</span>
                        <span class="contact-text" th:text="${profile.city}">city</span>
                    </div>

                    <div class="contact-row" th:if="${profile.linkedIn}">
                        <span class="contact-icon" aria-hidden="true">in</span>
                        <span class="contact-text" th:text="${profile.linkedIn}">linkedin</span>
                    </div>

                    <div class="contact-row" th:if="${profile.portfolio}">
                        <span class="contact-icon" aria-hidden="true">W</span>
                        <span class="contact-text" th:text="${profile.portfolio}">web</span>
                    </div>
                </div>
            </div>

            <div class="sb-section">
                <div class="sb-title">Compétences</div>
                <div th:if="${profile.technologies}">
                        <span th:each="tech : ${profile.technologies}" class="skill-tag"
                              th:text="${tech}">Java</span>
                </div>
            </div>

        </div>
    </div>

    <div class="main-content">

        <div class="name-title">
            <span th:text="${profile.firstName}">Prénom</span>
            <span class="name-highlight" th:text="${profile.lastName}">Nom</span>
        </div>

        <div class="job-title" th:text="${profile.title}">
            Développeur Full Stack
        </div>

        <div class="summary-box" th:text="${profile.summary}">
            Résumé professionnel...
        </div>

        <h2 class="section-title">Expériences Professionnelles</h2>

        <div class="timeline-container">
            <div th:each="exp : ${experiences}" class="exp-item">

                <div class="exp-header">
                        <span class="exp-date-badge">
                            <span th:text="${exp.startDate}">2020</span>
                            <span th:if="${exp.endDate}">
                                - <span th:text="${exp.endDate}">2022</span>
                            </span>
                            <span th:unless="${exp.endDate}"> - Présent</span>
                        </span>
                    <span class="exp-role" th:text="${exp.title}">Role</span>
                </div>

                <div class="exp-company" th:text="${exp.company}">Entreprise</div>

                <div class="exp-desc" th:text="${exp.description}">
                    Description...
                </div>

                <div class="tech-stack-row" th:if="${exp.technologies}">
                        <span th:each="t : ${exp.technologies}" class="tech-pill"
                              th:text="${t}">#Tech</span>
                </div>

            </div>
        </div>

        <div class="footer">
            CV généré automatiquement par Portfolio App •
            <span th:text="${#temporals.format(T(java.time.LocalDate).now(), 'dd MMM yyyy')}">
                    Date
                </span>
        </div>

    </div>
</div>
</body>

</html>
